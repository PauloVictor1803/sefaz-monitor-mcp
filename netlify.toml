[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/docs"
  to = "/docs.html"
  status = 200

[[redirects]]
  from = "/llm.txt"
  to = "/llms.txt"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/sse"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/mcp"
  status = 200
